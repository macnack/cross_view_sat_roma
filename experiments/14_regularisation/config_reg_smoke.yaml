run:
  command: scripts/train_vigor.py --config configs/vigor_cell0125.yaml --query erp_depth
    --head --pose-nll-weight 0.5 --split samearea --val-frac 0.2 --workers 8 --pin-memory
    --tf32 --encoder-dtype bfloat16 --decoder-dtype bfloat16 --compile encoder --out
    experiments/14_regularisation --batch 32 --epochs 1 --train-limit 1280 --val-samples
    128 --save-every-epochs 1 --resume auto --tag reg_smoke --aug-photometric 0.8
    --aug-geometric rot90,flip,shift --aug-rot-deg 10 --label-smoothing 0.1 --weight-decay-decoder
    0.05 --weight-decay-head 0.05 --feat-dropout 0.1 --select-by pose
  time: '2026-09-30 14:35:36'
  git: 4882e71
  tag: reg_smoke
  ckpt: null
  split: samearea
  train_cities: &id001
  - NewYork
  - Seattle
  - SanFrancisco
  - Chicago
  val_cities: *id001
  val_frac: 0.2
  val_samples: 128
  query_mode: erp_depth
  vce_weight: 1.0
  no_depth:
    train: 0
    val: 0
  pose_nll_weight: 0.5
  refine_weight: 0.0
  epochs: 1
  steps: 40
  batch: 32
  reg:
    label_smoothing: 0.1
    weight_decay_decoder: 0.05
    weight_decay_head: 0.05
    feat_dropout: 0.1
    select_by: pose
    aug:
      photometric: 0.8
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue_deg: 5.0
      blur_p: 0.2
      blur_sigma: 1.0
      geometric:
      - rot90
      - flip
      - shift
      rot_deg: 10.0
      shift_max_m: null
  tf32: true
  decoder_dtype: bfloat16
  encoder_dtype: bfloat16
  compile: encoder
  world_size: 4
  batch_per_rank: 8
  val_batch: 32
  loss_norm: global_counts
config:
  data:
    root: data/dur360bev
    ortho: data/ortho/durham/2009_ea_irrgb/durham_2009_25cm.vrt
  erp:
    size:
    - 1280
    - 640
    lens: dur360
    lens_params:
      fov_inner_deg: 196.0
      fov_outer_deg: 203.0
      alpha: 1.0
    valid_mask: experiments/00_calib/erp_valid_1280x640.npy
  calib:
    cam_from_lidar_rpy_deg:
    - 0.0
    - 0.0
    - 0.0
    cam_from_lidar_t_m:
    - 0.0
    - 0.0
    - -0.27
    lidar_height_m: 1.57
  grid:
    n: 224
    cell_m: 0.125
  ground:
    floor_cell_m: 0.5
    ground_tol_m: 0.2
    max_floor_dev_m: 1.2
    max_range_m: 40.0
    contact_max_height_m: 0.7
  edges:
    min_obj_height_m: 1.5
    max_jump_m: 0.75
  mask:
    frames:
      ranges:
      - - 500
        - 1450
      - - 1900
        - 2700
      stride: 10
    std_thresh: 5.0
    meanhp_thresh: 6.0
    min_blob_px: 80
    margin_px: 6
    seam_halfwidth_px: 4
    horizon_frac: 0.53
  oxts:
    convention: ccw_from_east
    min_speed_mps: 2.0
    smooth: 2
  matcher:
    checkpoint: 0t1q66hy
    use_means: false
    min_valid_frac: 0.5
    reproj_cells: 3.0
    seed: 0
    solver: srt
  fusion:
    backbone: convnext_tiny.dinov3_lvd1689m
    dim: 128
    ground_fill: true
  train:
    steps: 2000
    batch: 2
    lr_bev: 0.0002
    lr_decoder: 1.0e-05
    weight_decay: 0.01
    min_patch_valid: 0.25
    min_ref_cell_valid: 0.5
    val_ranges:
    - - 710
      - 2400
    val_every: 250
    val_frames: 32
    seed: 0
    vce_weight: auto
    refine_weight: 0.0
    refine_alpha: 0.5
    refine_c: 0.0001
    refine_cert_cells: 0.5
    refine_precision: float32
    refine_grad_clip: 1.0
    refine_max_nonfinite: 20
    label_smoothing: 0.0
    weight_decay_decoder: null
    weight_decay_head: null
    feat_dropout: 0.0
    select_by: pose
    aug_photometric: 0.0
    aug_brightness: 0.2
    aug_contrast: 0.2
    aug_saturation: 0.2
    aug_hue_deg: 5.0
    aug_blur_p: 0.2
    aug_blur_sigma: 1.0
    aug_geometric: []
    aug_rot_deg: 0.0
    aug_shift_max_m: null
  lift:
    erp_size:
    - 896
    - 448
    dim: 128
    depth_bins: 16
    d_min: 1.0
    d_max: 40.0
    max_elev_deg: -5.0
    min_patch_valid: 0.05
    train_decoder: true
    lr_lift: 0.0002
    steps: 2000
    batch: 1
    local_radius: 6
    max_offset_frac: 0.1
    max_rot_deg: 10.0
    margin_m: 120.0
    val_every: 200
    val_frames: 48
    neighbour_radius: 0
    neighbour_weight: 0.5
    ref_scales:
    - 3
    - 4
    - 5
    - 6
    offset_range:
    - 0.05
    - 0.18
    rot_range:
    - 3.0
    - 20.0
    colour_jitter: true
    attitude_noise_deg: 2.0
    neg_frac: 0.15
    neg_sep_frac:
    - 0.7
    - 1.4
    certainty_weight: 0.01
    pose_nll_weight: 0.0
    seq_dists_m:
    - 0.0
    query_mode: erp_depth
    min_elev_deg: -3.5
    ground_max_range_m: 28.0
  vigor:
    root: null
    row_sign: 1.0
    col_sign: -1.0
    height_m: 2.5
    fg2_batch: 24
  erp_query:
    max_range_m: 40.0
  erp_depth:
    max_depth_m: 35.0
    erp_size:
    - 896
    - 448
    head: true
    head_dim: 256
    head_convs: 2
    head_heads: 4
    head_ff_mult: 2
    lr_head: 0.0002
    vce_samples: 1024
    vce_mode: sample
    vce_grid_m: 5.0
    vce_points: 10
    vce_use_certainty: true
  ipm:
    height_m: 1.7
    blind_radius_m: 1.2
    max_depression_deg: 20.0
    semantic_dynamic_mask: true
    semantic_ground_only: false
    contact_line: false
    contact_classes:
    - 2
    - 3
    - 4
    contact_vegetation: true
    contact_thickness_px: 2
  reference:
    scale: 4
    max_offset_frac: 0.3
    max_rot_deg: 55.0
  pf:
    n: 512
    init_sigma_xy: 10.0
    init_sigma_yaw: 5.0
    sigma_xy: 1.0
    sigma_yaw: 1.0
    sigma_yaw_obs: 5.0
    temperature: 1.0
